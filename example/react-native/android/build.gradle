buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Stroeer SDK repositories. The app declares them itself because Gradle resolves the SDK's
// transitive dependencies (com.stroeer.ads, Confiant) from the app's repositories.
allprojects {
    repositories {
        maven {
            url "https://stroeersdk.github.io/android/maven"
            content { includeGroup("com.stroeer.ads") }
        }
        maven {
            url 'https://cdn.confiant-integrations.net/backend-integrations/in-app/releases/android/maven'
            content { includeGroup("com.confiant.android") }
        }
    }
}
